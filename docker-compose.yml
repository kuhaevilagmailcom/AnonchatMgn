services:
  anonchat-mgn:
    build: .
    container_name: anonchat-mgn
    env_file: .env
    environment:
      # Match the published container port if .env omits MINIAPP_PORT.
      MINIAPP_PORT: ${MINIAPP_PORT:-8080}
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    ports:
      - "8080:8080"
    # раскомментируй, если переведёшь бота на вебхук вместо polling
    # ports:
    #   - "8081:8081"

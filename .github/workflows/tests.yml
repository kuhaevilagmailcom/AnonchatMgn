name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# During rapid fixes only the newest run per branch needs runners.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Independent suites: one hanging SQLite test must not hide other failures.
jobs:
  python:
    name: Python · ${{ matrix.suite }}
    runs-on: ubuntu-latest
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        suite:
          - core
          - flow
          - moderation_channel
          - admin_miniapp
          - admin_reliability
          - load_smoke
          - game_resilience
          - dice_duels
          - test_city_capture
          - test_city_game_api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run isolated test suite with hang protection
        run: timeout --signal=TERM --kill-after=5s 240s python -u -m tests.${{ matrix.suite }}

  python-syntax:
    name: Python syntax
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m compileall -q anonchat tests main.py

  browser-js:
    name: Mini App JavaScript and UI
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: |
          node --check miniapp/web/app.js
          node --check miniapp/web/admin.js
          node --check miniapp/web/realtime.js
          node --check miniapp/web/city.js
          node --check miniapp/web/city-access.js

  mobile-layout:
    name: Mobile layout · Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-save --no-package-lock playwright-core@1.56.0
      - name: Check all active Mini App screens at 320–430px
        run: node tests/mobile_layout.cjs

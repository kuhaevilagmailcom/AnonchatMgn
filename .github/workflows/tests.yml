name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m tests.core
      - run: python -m tests.flow
      - run: python -m tests.moderation_channel
      - run: python -m tests.admin_miniapp
      - run: python -m tests.admin_reliability
      - run: python -m tests.load_smoke
      - run: python -m tests.game_resilience
      - run: python -m tests.wall
      - run: python -m compileall -q .
      - run: node --check miniapp/web/app.js
      - run: node --check miniapp/web/wall.js
      - run: node --check miniapp/web/admin.js

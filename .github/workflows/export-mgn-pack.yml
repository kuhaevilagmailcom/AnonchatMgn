name: Export Magnitogorsk GeoGuessr pack

on:
  push:
    branches:
      - tmp-mgn-geoguessr-pack
    paths:
      - ".github/workflows/export-mgn-pack.yml"

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-mgn-geoguessr-pack
      - name: Verify pack
        run: |
          test -f .mgn-pack-output/Magnitogorsk_GeoGuessr_20.zip
          unzip -l .mgn-pack-output/Magnitogorsk_GeoGuessr_20.zip
          sha256sum .mgn-pack-output/Magnitogorsk_GeoGuessr_20.zip
      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Magnitogorsk_GeoGuessr_20
          path: .mgn-pack-output/Magnitogorsk_GeoGuessr_20.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

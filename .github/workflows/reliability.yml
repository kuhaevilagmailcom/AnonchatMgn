name: Reliability checks

on:
  pull_request:
  push:
    branches:
      - 'fix/**'

permissions:
  contents: read

jobs:
  reliability:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m tests.admin_reliability
      - run: python -m tests.admin_miniapp
      - run: python -m compileall -q anonchat main.py tests
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check miniapp/web/admin.js
